<div class="overview-select">
  <p class="intro" data-i18n="overview.repair_intro"></p>
  <div id="accounts"><p class="muted" data-i18n="overview.loading"></p></div>
  <button id="submit" class="homey-button-primary-full" type="button" data-i18n="overview.save"></button>
</div>

<script type="text/javascript">
  (function () {
    var container = document.getElementById('accounts');
    var submit = document.getElementById('submit');

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function checkbox(name, value, label, checked) {
      var wrapper = el('label', 'homey-form-checkbox');
      var input = el('input', 'homey-form-checkbox-input');
      input.type = 'checkbox';
      input.name = name;
      input.value = value;
      input.checked = checked;
      wrapper.appendChild(input);
      wrapper.appendChild(el('span', 'homey-form-checkbox-checkmark'));
      wrapper.appendChild(el('span', 'homey-form-checkbox-text', label));
      var group = el('div', 'homey-form-group');
      group.appendChild(wrapper);
      return group;
    }

    function render(accounts, selected) {
      container.textContent = '';
      accounts.forEach(function (account) {
        var block = el('div', 'account');
        block.dataset.patId = account.patId;
        block.appendChild(el('div', 'account-name', account.name));
        block.appendChild(el('div', 'muted', Homey.__('overview.own_apps')));

        var organizations = el('fieldset', 'homey-form-fieldset organizations');
        if (account.organizations.length === 0) {
          organizations.appendChild(el('div', 'muted', Homey.__('overview.no_organizations')));
        } else {
          organizations.appendChild(el('legend', 'homey-form-legend', Homey.__('overview.organizations')));
          account.organizations.forEach(function (organization) {
            // Devices without a stored choice count every organization.
            var checked = !selected || selected.indexOf(organization.id) !== -1;
            organizations.appendChild(checkbox('organization', organization.id, organization.name, checked));
          });
        }
        block.appendChild(organizations);
        container.appendChild(block);
      });
    }

    function checkedValues(root, name) {
      return Array.prototype.slice.call(root.querySelectorAll('input[name="' + name + '"]:checked'))
          .map(function (input) { return input.value; });
    }

    Homey.setTitle(Homey.__('overview.repair_title'));
    Homey.emit('get_accounts').then(function (result) {
      render(result.accounts || [], result.selected);
    }).catch(function (error) {
      Homey.alert(error.message || error.toString(), 'error');
    });

    submit.addEventListener('click', function () {
      var blocks = Array.prototype.slice.call(container.querySelectorAll('.account'));
      submit.classList.add('is-loading');

      var done = function () { submit.classList.remove('is-loading'); };
      var fail = function (error) { done(); Homey.alert(error.message || error.toString(), 'error'); };

      var ids = blocks.length ? checkedValues(blocks[0], 'organization') : [];
      Homey.emit('save_organizations', ids).then(function () { done(); Homey.done(); }).catch(fail);
    });
  })();
</script>

<style type="text/css">
  .overview-select { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
  .intro { margin: 0; }
  .account { padding: 0.75rem 1rem; border: 1px solid #e4e5e7; border-radius: 0.5rem; }
  .account-name { font-weight: 600; }
  .organizations { margin: 0.75rem 0 0; padding: 0; border: 0; }
  .muted { color: #8a8d91; font-size: 0.875rem; margin: 0.25rem 0; }
</style>
