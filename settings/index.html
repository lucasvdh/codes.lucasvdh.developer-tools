<!DOCTYPE html>
<html>

<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style type="text/css">
    html, body {
      height: 100%;
    }

    .form-wrapper {
      min-height: calc(100% - 115px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
    }

    .footer {
      margin-top: auto;
      padding-top: 1.5rem;
    }

    .alert {
      position: relative;
      padding: 0.75rem 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid transparent;
      border-radius: 0.25rem;
    }

    .help {
      color: #383d41;
      background-color: #f4f5f5;
      border-color: #e4e5e7;
    }

    .alert-success {
      color: #155724;
      background-color: #d4edda;
      border-color: #c3e6cb;
    }

    .alert-danger {
      color: #721c24;
      background-color: #f8d7da;
      border-color: #f5c6cb;
    }

    .token-steps {
      margin: 0 0 1rem 1.25rem;
      padding: 0 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
      color: #383d41;
    }

    .token-steps li {
      margin-bottom: 0.4rem;
    }

    .token-steps code {
      background: #e4e5e7;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.85em;
    }

    .button-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .button-row > button {
      flex: 1;
    }

    #status-message {
      display: none;
      margin-top: 1rem;
    }

    #status-message.visible {
      display: block;
    }

    .homey-form-legend + .homey-form-group,
    fieldset > legend.homey-form-legend.section-spacer {
      margin-top: 2rem;
    }
  </style>
</head>

<body>

<header class="homey-header">
  <h1 class="homey-title" data-i18n="settings.title"></h1>
  <p class="homey-subtitle" data-i18n="settings.description"></p>
</header>

<div class="form-wrapper">
  <form class="homey-form">
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.authorisation_settings">Authorization</legend>

      <div class="homey-form-group">
        <label class="homey-form-label" for="personal_access_token" data-i18n="settings.personal_access_token">Personal Access Token</label>
        <input class="homey-form-input" id="personal_access_token" type="password" autocomplete="off"/>
      </div>

      <div class="button-row">
        <button id="test-button" class="homey-button-secondary-full" type="button" data-i18n="settings.test"></button>
        <button id="save-button" class="homey-button-primary-full" type="button" data-i18n="settings.save"></button>
      </div>

      <div id="status-message" class="alert"></div>

      <legend class="homey-form-legend section-spacer" data-i18n="settings.polling_settings">Polling</legend>

      <div class="homey-form-group">
        <label class="homey-form-label" for="polling_frequency" data-i18n="settings.polling_frequency">Polling frequency (in minutes)</label>
        <input class="homey-form-input" id="polling_frequency" type="number" min="1" value="15"/>
      </div>
    </fieldset>
  </form>

  <div class="footer">
    <p class="alert help">
      <span data-i18n="settings.token_instructions_intro">To get a Personal Access Token:</span>
    </p>
    <ol class="token-steps">
      <li data-i18n="settings.token_step_open">Open <a href="https://tools.developer.homey.app/me" target="_blank">tools.developer.homey.app/me</a> and sign in with your Athom account.</li>
      <li data-i18n="settings.token_step_copy">In the <em>Personal Access Token</em> section, copy the token (it starts with <code>pat-</code>).</li>
      <li data-i18n="settings.token_step_paste">Paste it above and press <em>Test</em> to verify, then <em>Save</em>.</li>
    </ol>
  </div>
</div>

<script type="text/javascript">
  const tokenInput = document.getElementById('personal_access_token');
  const pollingInput = document.getElementById('polling_frequency');
  const saveButton = document.getElementById('save-button');
  const testButton = document.getElementById('test-button');
  const statusEl = document.getElementById('status-message');

  function showStatus(type, message) {
    statusEl.className = 'alert visible alert-' + type;
    statusEl.textContent = message;
  }

  function hideStatus() {
    statusEl.className = 'alert';
    statusEl.textContent = '';
  }

  function onHomeyReady(Homey) {
    Homey.get('personal_access_token', function (err, value) {
      if (!err && value) tokenInput.value = value;
    });

    Homey.get('polling_frequency', function (err, value) {
      if (!err && value) pollingInput.value = value;
    });

    function format(template, values) {
      return Object.keys(values).reduce(function (acc, key) {
        return acc.split('{{' + key + '}}').join(String(values[key]));
      }, template);
    }

    testButton.addEventListener('click', async function () {
      hideStatus();
      const token = tokenInput.value.trim();
      if (!token) {
        showStatus('danger', Homey.__('settings.test_no_token'));
        return;
      }
      testButton.classList.add('is-loading');
      try {
        const result = await Homey.api('POST', '/test-token', { token });
        if (result && result.ok) {
          showStatus('success', format(Homey.__('settings.test_success'), { count: result.appCount || 0 }));
        } else {
          showStatus('danger', format(Homey.__('settings.test_failure'), { error: (result && result.error) || 'Unknown error' }));
        }
      } catch (err) {
        showStatus('danger', format(Homey.__('settings.test_failure'), { error: (err && err.message) || String(err) }));
      } finally {
        testButton.classList.remove('is-loading');
      }
    });

    saveButton.addEventListener('click', function (event) {
      event.preventDefault();
      hideStatus();
      saveButton.classList.add('is-loading');

      Homey.set('personal_access_token', tokenInput.value.trim(), function (error) {
        if (error) {
          console.error(error);
          showStatus('danger', Homey.__('settings.save_failure'));
          saveButton.classList.remove('is-loading');
          return;
        }

        const polling = parseInt(pollingInput.value, 10);
        Homey.set('polling_frequency', isNaN(polling) ? 15 : Math.max(1, polling), function (e2) {
          saveButton.classList.remove('is-loading');
          if (e2) {
            console.error(e2);
            showStatus('danger', Homey.__('settings.save_failure'));
          } else {
            showStatus('success', Homey.__('settings.save_success'));
          }
        });
      });
    });

    Homey.ready();
  }
</script>
</body>

</html>
